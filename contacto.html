<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simuladores Inercia</title>

  <link rel="stylesheet" href="css/contacto.css">
  <link rel="stylesheet" href="css/menu.css">
<link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600&display=swap"
  rel="stylesheet"
>
</head>


<body>

  <!-- BACKGROUND -->

  <video
    class="page-bg-video"
    autoplay
    muted
    loop
    playsinline
  >
    <source
      src="https://firebasestorage.googleapis.com/v0/b/inerciaapp-e0cc4.firebasestorage.app/o/assets%2Fbackground1.mp4?alt=media&token=cc4f4fcf-328b-4e9f-a13e-e90faa3ae8ce"
      type="video/mp4"
    >
  </video>

  <div class="page-overlay"></div>


  <!-- HEADER -->

  <div class="header-wrap">

    <header class="header">

      <button
        class="menu-btn"
        id="menuBtn"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="sideMenu"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 6H20M4 12H20M4 18H20"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>


      <div class="logo">
        <img
          class="logo-img"
          src="https://firebasestorage.googleapis.com/v0/b/inerciaapp-e0cc4.firebasestorage.app/o/assets%2Fsimuladoresinercia.png?alt=media&token=cc07fe5e-c3a0-449c-a474-8ba1ceb0a0be"
          alt="Simuladores Inercia"
        >
      </div>


      <button
        class="auth-btn"
        id="authBtn"
        type="button"
        aria-label="Iniciar sesión"
      >
        <img
          src="https://firebasestorage.googleapis.com/v0/b/inerciaapp-e0cc4.firebasestorage.app/o/assets%2Fdefaultpfp3.jpg?alt=media&token=a0435be5-f789-41ec-9d50-ab24fed4b9ec"
          alt="Perfil"
          class="auth-pfp"
          id="authPfp"
        >
      </button>

    </header>

  </div>


  <!-- MENU -->

  <div class="menu-overlay" id="menuOverlay"></div>

  <nav
    class="side-menu"
    id="sideMenu"
    aria-hidden="true"
  >

    <div class="side-menu-header">

      <span>MENÚ</span>

      <button
        class="menu-close"
        id="menuClose"
        type="button"
        aria-label="Cerrar menú"
      >
        &times;
      </button>

    </div>


      <div class="side-menu-links">
    <a href="https://api.whatsapp.com/send?phone=50493266075&text=Buenas!%20Quisiera%20Reservar%20un%20Simulador." class="side-menu-link">
      RESERVAR
    </a>
    <a href="/standings" class="side-menu-link">
      RESULTADOS
    </a>
    <a href="/contacto" class="side-menu-link">
      CONTACTO
    </a>
  </div>
  <div class="side-menu-footer">
    <span>SIMULADORES INERCIA</span>
  </div>
  </nav>


  <!-- CONTACT -->

  <main class="contact-page">

    <section class="contact-heading">

      <p class="contact-eyebrow">
        SIMULADORES INERCIA
      </p>

      <h1>
        CONTACTO
      </h1>



    </section>


    <div class="contact-layout">


      <!-- LEFT SIDE -->

      <section class="contact-info">

        <!-- WHATSAPP -->

        <a
          href="https://api.whatsapp.com/send?phone=50493266075&text=Buenas!%20Quisiera%20Reservar%20un%20Simulador."
          class="contact-item"
          aria-label="Contactar por WhatsApp"
           target="_blank"
        >

          <div class="contact-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.5 4.1 1.6 5.9L.2 24l6.5-1.7a11.7 11.7 0 0 0 5.4 1.4h.1C18.7 23.7 24 18.4 24 11.9c0-3.2-1.2-6.1-3.5-8.4ZM12.2 21.7h-.1a9.7 9.7 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.7 9.7 0 0 1-1.5-5.2C2.2 6.4 6.6 2 12.1 2a9.8 9.8 0 0 1 7 2.9 9.8 9.8 0 0 1 2.9 7c0 5.4-4.4 9.8-9.8 9.8Zm5.4-7.3c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.7-.8-2.8-1.5-3.9-3.4-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.3 1.4 3.5c.2.2 2.4 3.7 5.9 5.2.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.2-.6-.4Z"
              />
            </svg>

          </div>


          <div class="contact-item-copy">

            <span class="contact-label">
              WHATSAPP
            </span>

            <strong>
              ESCRIBÍNOS
            </strong>

            <p>
              Reservaciones, preguntas y soporte.
            </p>

          </div>


          <span class="contact-arrow">
            →
          </span>

        </a>


        <!-- INSTAGRAM -->

        <a
          href="https://www.instagram.com/inercia_hn/"
          class="contact-item"
          aria-label="Instagram"
           target="_blank"
        >

          <div class="contact-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
              />

              <circle
                cx="12"
                cy="12"
                r="4"
              />

              <circle
                cx="17.5"
                cy="6.5"
                r="1"
                class="icon-fill"
              />
            </svg>

          </div>


          <div class="contact-item-copy">

            <span class="contact-label">
              INSTAGRAM
            </span>

            <strong>
              @inercia_hn
            </strong>

            <p>
              Seguínos para eventos y promociones.
            </p>

          </div>


          <span class="contact-arrow">
            →
          </span>

        </a>


        <!-- LOCATION -->

        <div class="contact-item contact-location">

          <div class="contact-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 21s7-6.1 7-12A7 7 0 1 0 5 9c0 5.9 7 12 7 12Z"
              />

              <circle
                cx="12"
                cy="9"
                r="2.5"
              />
            </svg>

          </div>


          <div class="contact-item-copy">

            <span class="contact-label">
              UBICACIÓN
            </span>

            <strong>
              SIMULADORES INERCIA
            </strong>

            <p>
              Tegucigalpa, Honduras
            </p>

          </div>

        </div>

      </section>


      <!-- MAP -->

      <section class="map-section">

        <div class="map-header">

          <div>


            <h2>
              NUESTRA UBICACIÓN
            </h2>

          </div>


          <a
            href="https://www.google.com/maps/search/?api=1&query=Simuladores+Inercia+Tegucigalpa+Honduras"
            target="_blank"
            rel="noopener noreferrer"
            class="maps-button"
          >
            ABRIR EN MAPS
            <span>↗</span>
          </a>

        </div>


        <div class="map-frame">

          <iframe
            src="https://www.google.com/maps?q=Simuladores%20Inercia%20Tegucigalpa%20Honduras&output=embed"
            width="100%"
            height="100%"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Ubicación de Simuladores Inercia"
          ></iframe>

          <div class="map-accent"></div>

        </div>

      </section>

    </div>

  </main>


  <script type="module" src="js/menu.js" defer></script>
  <script type="module" src="js/auth.js" defer></script>

</body>
</html>
