<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simuladores Inercia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="https://firebasestorage.googleapis.com/v0/b/inerciaapp-e0cc4.firebasestorage.app/o/assets%2FLogiconR.png?alt=media&token=1b8aa73a-e5f9-450b-8bdb-50d1e8e769c5">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="bg-grid"></div>

<header class="navbar">

  <div class="container nav-wrapper">

    <a href="index.html" class="logo">

      <img src="https://firebasestorage.googleapis.com/v0/b/inerciaapp-e0cc4.firebasestorage.app/o/assets%2Fsimuladoresinercia.png?alt=media&token=cc07fe5e-c3a0-449c-a474-8ba1ceb0a0be" alt="Inercia">

    </a>

    <nav class="nav-links">
<a href="/standings">Resultados</a>
<a href="/reservas">Reservas</a>
<a href="/contacto">Contacto</a>
    </nav>

    <div class="nav-right">
      <button id="open-auth" class="nav-btn">
        Login
      </button>

      <div id="user-ui" class="user-auth hidden-auth">

        <div class="user-profile">

          <img
            id="navbar-pfp"
            src="assets/default-user.png"
            alt="">

        </div>

      </div>

    </div>

  </div>

</header>
<div id="auth-overlay" class="auth-overlay hidden-auth">

  <div class="auth-modal">

    <button id="close-auth" class="close-auth">
      ✕
    </button>

    <div class="auth-tabs">

      <button id="login-tab" class="auth-tab active-tab">
        Login
      </button>

      <button id="register-tab" class="auth-tab">
        Registro
      </button>

    </div>

    <div id="login-form" class="auth-form">

      <h2>
        Bienvenido de nuevo.
      </h2>

      <p>
        Inicia sesión para competir y reservar.
      </p>

      <input
        id="login-email"
        type="email"
        placeholder="Correo electrónico">

      <input
        id="login-password"
        type="password"
        placeholder="Contraseña">

      <button id="login-btn" class="auth-submit">
        Iniciar Sesión
      </button>

      <button id="google-login" class="google-btn">

        <img src="FIREBASE_GOOGLE_ICON" alt="">

        <span>
          Continuar con Google
        </span>

      </button>

    </div>

    <div id="register-form" class="auth-form hidden-auth">

      <h2>
        Crea tu perfil.
      </h2>

      <p>
        Únete a la comunidad Inercia.
      </p>

      <input
        id="register-name"
        type="text"
        placeholder="Nombre de usuario">

      <input
        id="register-email"
        type="email"
        placeholder="Correo electrónico">

      <input
        id="register-password"
        type="password"
        placeholder="Contraseña">

      <button id="register-btn" class="auth-submit">
        Crear Cuenta
      </button>

    </div>

  </div>

</div>

  <section class="hero-header">

    <div>

      <span class="section-label">
        CAMPEONATO DE FORMULA 1
      </span>

      <h1>
        RESULTADOS
      </h1>

    </div>

  </section>

  <main class="standings-wrapper">

    <div class="table-header">

      <span>POS</span>
      <span>PILOTO</span>
      <span>TIEMPO</span>
      <span>DIFERENCIA</span>

    </div>

    <div id="leaderboard" class="leaderboard"></div>
  </main>
  <div class="standings-topbar">

  <div class="standings-dropdown">

    <select id="category-select">

      <option value="M">
        Masculino
      </option>

      <option value="F">
        Femenino
      </option>

      <option value="TEAM">
        Team Inercia
      </option>
<option value="ALL">
  Todos
</option>
    </select>

  </div>

</div>

  <script src="standings.js"></script>
<script src="config.js"></script>
<script type="module" src="/firebase-auth.js"></script>
<script type="module" src="/standings.js"></script>
</body>
</html>
