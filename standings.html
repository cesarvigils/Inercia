<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    standings.html — Lap-time leaderboard page.
    Scripts: js/standings.js (fetches /api/standings and renders the leaderboard/category filter/"MI
    TIEMPO" card — see its header comment for details), js/menu.js (side nav), js/auth.js (login/profile
    UI, needed because "MI TIEMPO" depends on the signed-in user).
    Styles: css/standings.css (this page's layout), css/menu.css, css/auth.css.
    Vite entry point: registered under `standings` in vite.config.js.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simuladores Inercia</title>
  <meta name="description" content="Standings de Simuladores Inercia: tiempos de vuelta, clasificación por categoría y tu mejor tiempo.">
  <link rel="stylesheet" href="/css/standings.css">
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/auth.css">
<link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Alumni+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap"
    rel="stylesheet"
  >
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <!-- @partial bg-video -->

  <div class="page-overlay"></div>
  <!-- @partial site-header -->

  <main class="standings">

    <!-- Event heading -->

    <section class="event-header">

      <div class="event-info">

        <p class="event-month" id="eventMonth">&nbsp;</p>

        <h1>
          TABLA DE TIEMPOS
        </h1>

        <p class="event-detail">
          CIRCUITO:
          <strong id="circuitoName">Cargando...</strong>
        </p>

        <p class="event-detail">
          AUTO:
          <strong id="carName">F1 2025</strong>
        </p>


        <div class="record">

          <p>
            RECORD ACTUAL:
            <strong id="recordTime">--:--.---</strong>
          </p>

          <p>
            PILOTO:
            <strong id="recordPiloto">-</strong>
          </p>


        </div>

      </div>
      <!-- Track -->

      <div class="track-area">

        <!-- No default src: standings.js sets this month's map from
             public/data/tracks.json and keeps it hidden if there's none
             or it fails to load (no broken-image icon on the page). -->
        <img
          id="trackMapImg"
          alt="Mapa del circuito del mes"
          class="track-map"
          hidden
        >

        <div class="category-select-wrap">
          <select
            class="category-select"
            id="categorySelect"
            aria-label="Categoría"
          >
            <option value="todos">TODOS</option>
            <option value="femenino">FEMENINO</option>
            <option value="masculino">MASCULINO</option>
            <option value="team">TEAM INERCIA</option>
          </select>
        </div>

      </div>

    </section>


    <!-- MI TIEMPO: the signed-in user's result as a regular leaderboard
         row (no header), filled by js/standings.js renderMyTimeRow().
         Tapping it scrolls to their highlighted row in the table. -->

    <p class="my-time-title" id="myTimeTitle">MI TIEMPO:</p>

    <div class="standing-row my-time-row is-me is-empty" id="myTimeRow" aria-labelledby="myTimeTitle">
      <span class="position">–</span>
      <span class="driver">CARGANDO…</span>
      <span class="time"></span>
      <span class="difference"></span>
    </div>


    <!-- Orange separator -->

    <div class="orange-line"></div>


    <!-- Table -->

    <section class="leaderboard" role="table" aria-label="Tabla de tiempos">

      <div class="leaderboard-head" role="row">

        <span role="columnheader">POS</span>
        <span role="columnheader">PILOTO</span>
        <span role="columnheader">TIEMPO</span>
        <span role="columnheader">DIFERENCIA</span>

      </div>


      <div class="leaderboard-body" id="leaderboard" role="rowgroup" aria-live="polite">
        <p class="standings-loading">Cargando tabla de tiempos…</p>
      </div>

    </section>

  </main>

  <!-- @partial site-footer -->
  <script type="module" src="/js/menu.js" defer></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/standings.js" defer></script>
</body>
</html>
