<!DOCTYPE html>
<html lang="es">
<head>
<!--
  suscripcion.html — Membership plans (Gold / Platino / Zafiro) and PayPal sign-up.
  Scripts: js/suscripcion.js (lists /api/subscription/plans, starts the PayPal subscription and
  confirms it when PayPal sends the buyer back), js/auth.js, js/menu.js, js/navbar.js.
  Styles: css/style.css (shared base), css/menu.css, css/navbar.css, css/auth.css, css/suscripcion.css.
  Vite entry point: registered under `suscripcion` in vite.config.js; served at /suscripcion (vercel.json).
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simuladores Inercia</title>
<meta name="description" content="Membresías Gold, Platino y Zafiro de Simuladores Inercia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Alumni+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/menu.css">
<link rel="stylesheet" href="/css/navbar.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/suscripcion.css">
<link rel="icon" type="image/png" href="/favicon.png">
<script type="module" src="/js/auth.js"></script>
</head>

<body>

  <!-- @partial bg-video -->

  <!-- @partial site-header -->

  <main class="sub-page">

    <header class="sub-heading">
      <p class="sub-eyebrow">SIMULADORES INERCIA</p>
      <h1 class="sub-title">MEMBRESÍAS</h1>
      <p class="sub-lead">Elegí tu plan y cada cuánto querés pagarlo. El cobro es automático con PayPal.</p>
    </header>

    <div class="sub-notice" id="subNotice" role="status" hidden></div>

    <section class="sub-plans" aria-labelledby="subPeriodLabel">
      <div class="sub-plans-head">
        <p class="sub-label" id="subPeriodLabel">FRECUENCIA DE PAGO</p>
        <div class="sub-periods" id="subPeriods" role="tablist" aria-labelledby="subPeriodLabel"></div>
      </div>

      <div class="sub-tiers" id="subTiers" aria-live="polite">
        <p class="sub-state">CARGANDO PLANES…</p>
      </div>
    </section>

    <p class="sub-footnote">Con una membresía activa podés pagar tus reservas en efectivo.</p>

  </main>

  <!-- @partial site-footer -->

<script type="module" src="/js/menu.js"></script>
<script type="module" src="/js/navbar.js"></script>
<script type="module" src="/js/suscripcion.js"></script>
</body>
</html>
