<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página en Construcción</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top, rgba(255,140,26,.22), transparent 35%),
    #050505;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  padding: 2rem;
}

.card {
  width: min(520px, 100%);
  text-align: center;
  padding: 3rem 2rem;
  border-radius: 28px;
  background: rgba(15,15,15,.92);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

.icon {
  font-size: 4rem;
  margin-bottom: 1rem;
}

h1 {
  font-size: clamp(2rem, 8vw, 4rem);
  line-height: 1;
  margin-bottom: 1rem;
}

p {
  color: rgba(255,255,255,.65);
  font-size: 1.1rem;
}

span {
  color: #ff8c1a;
}
</style>
</head>

<body>
  <div class="card">
    <div class="icon"></div>
    <h1>Página web en <span>construcción</span></h1>
    <p>Estamos trabajando para tener todo listo muy pronto.</p>
  </div>
</body>
</html>
